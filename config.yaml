# diva 設定
# 閾値・重みはすべてここに集約する。コードに数値を直書きしない。

universe:
  # 対象市場（JPX data_j.xlsx の「市場・商品区分」の値）
  markets:
    - "プライム（内国株式）"
    - "スタンダード（内国株式）"
    - "グロース（内国株式）"
  # 除外業種（銀行・保険は財務指標の意味が違うため別ゲートで扱う）
  financial_sectors:
    - "銀行業"
    - "保険業"
    - "証券、商品先物取引業"
  bulk_batch_size: 100      # yf.download に一度に渡す銘柄数
  price_period: "max"       # 配当履歴を最大限取るため

# ---- ゲート（通らない銘柄はスコア計算すらしない）----
gate:
  min_listing_years: 5
  # 2026-09-16 の検証: 時価総額が小さいほど5年リターンは高かった。
  #     50億未満 +105.1%／50〜100億 +94.3%／100〜300億 +64.9%／1000億超 +35.9%
  #     減配率は 28.4% 対 22.8% とやや高いだけ。
  # つまり100億の足切りは、いちばんリターンの高い帯を丸ごと捨てていた。
  # ただし **この検証は上場廃止になった銘柄を見ていない**（株価が途切れて集計から
  # 外れる）。生存者バイアスは小型ほど強く効くので、撤廃はしない。50億に緩める。
  min_market_cap_oku: 50           # 億円
  # 売買代金の足切りは、高利回り候補に重ねると **リターン +5pt・減配率 −1.1pt** と
  # 効いていた（60.0% → 65.0%）。時価総額と違って残す理由がある。3,000万円のまま。
  min_avg_turnover_man: 3000       # 20日平均売買代金（万円）
  max_dividend_cuts_10y: 1         # 直近10年の減配回数
  # yfinance は銘柄によって3〜5期しか返さない（実測: 4期が605銘柄、3期が9銘柄）。
  # 「5期中4期」と絶対数で書くと、4期しか取れない銘柄が機械的に落ちる。
  # 取れた期数に対する比率で判定する。
  # 2026-09-16 の検証: 高利回り候補に「営業CFが黒字」を重ねても、3年以内の減配率は
  # 38.4% → 38.0%（0.4pt）しか下がらず、628 件を捨てていた。**ほぼ働いていない。**
  # 撤廃はせず（恒常的に営業CFが赤字の会社は論外なので）、半分に緩める。
  min_positive_ocf_ratio: 0.50     # 営業CFプラスの期数 ÷ 取得できた期数
  min_fiscal_periods: 3            # これ未満は判定不能として除外
  # 財務の足切りは2本立て。自己資本比率30%の一本槍だと通信・鉄道・電力といった
  # 設備産業が丸ごと落ちる（実測: NTT の自己資本比率は 20.8%）。
  # 「自己資本が厚い」か「レバレッジは高いが営業CFで返せる」かのどちらかで通す。
  # 2026-09-16 の検証: 高利回り候補に自己資本比率30%を重ねると、3年以内の減配率は
  # 38.4% → 39.2% と **かえって悪化**し、735 件を捨てていた。20%でも15%でも
  # 減配率はほぼ変わらない。自己資本比率は減配の予測にまったく効かない。
  #
  # ただし **この検証は倒産を見ていない**。上場廃止になった銘柄は株価が途切れる
  # ため、そもそも集計から外れる（生存者バイアス）。自己資本比率の本来の役目は
  # 「配当が減るか」ではなく「会社が消えないか」なので、撤廃はしない。
  # 効いていないと分かった以上、緩める方向に寄せる。
  min_equity_ratio: 0.20           # 自己資本比率（金融を除く）
  min_equity_ratio_leveraged: 0.10 # レバレッジ型の下限
  max_net_debt_to_ocf: 10.0        # ネット有利子負債 ÷ 営業CF（年）
  min_equity_ratio_financial: 0.04 # 金融は別基準
  max_payout_ratio: 0.70
  max_fcf_payout_ratio: 1.00
  max_loss_years_5y: 1
  min_dividend_years: 5            # 配当実績が5年未満は判定不能として除外

# ---- スコア重み ----
# 2026-09-15 の検証（4コホート・延べ9,220銘柄）とヘムの手法を踏まえて設定。
# 検証結果は docs/validation_report_2026-09-15.txt。
# 2026-09-15 の検証（4コホート・延べ9,220銘柄・5年先の実績）にもとづく。
# 詳細は docs/validation_2026-09-15.md。**検証を通った層だけ重みを上げる**。
weights:
  capacity: 0.5      # A 増配余力  **順位指標としてはノイズだった**（2026-09-15 に
                     #             EDINET の FY2022 を起点に1,211銘柄・3年で検証）。
                     #             配当性向の低さ 0.038 / 営業CFの厚み −0.000 と、
                     #             どれも 0.05 を超えない。自己資本比率とROEに至っては
                     #             リターンと**負の相関**（−0.160 / −0.196。高ROE＝割高）。
                     #             ただし「高利回りに重ねる足切り」としては効いたので、
                     #             ゼロにはせず 0.5。詳細は docs/validation_capacity_2026-09-15.md
  willingness: 0.5   # B 増配意思  検証で加点としては効かなかった。連続増配上位30社は
                     #             リターン +32.8% で全銘柄等分 +39.5% に負けた。
                     #             ただし減配の抑制には効く（減配率 49.2% 対 60.6%）ので、
                     #             減配歴はゲート側で効かせている
  growth: 0.5        # C 原資成長  2026-09-16 に EDINET の過去分（4コホート・延べ
                     #             8,039 銘柄・5年先）で検証した。**増配率は当てるが、
                     #             リターンにも減配にもつながらない。**
                     #             DPS成長との相関は EPS3年成長 0.139 / 営業CF3年成長 0.110 /
                     #             ROE 0.185 と、4コホートすべて同符号で安定している。
                     #             ところがトータルリターンとの相関は 0.037 で、
                     #             コホート別に見ると符号が入れ替わる（ROE: 0.057 /
                     #             0.100 / 0.084 / -0.114）。減配も減らない。
                     #             高利回りに「EPSが3年で増えている」を重ねると
                     #             DPS成長は +16% → +34% に上がるが、
                     #             リターンは +47% → +38% に**下がる**。
                     #             本検証の結論「配当成長率を当てるのは筋が悪い」
                     #             と同じ。A層と同じく 0.5 に下げる。
                     #             詳細は docs/validation_growth_2026-09-16.md
  neglect: 0.5       # D 見過ごされ度  **効き目が消えた**。トータルリターンとの相関は
                     #             2014年 0.160 / 2016年 0.157 → 2018年 -0.000 / 2020年 0.032。
                     #             前半だけの現象だったと考えるべきなので 1.2 から下げた
  valuation: 1.5     # E 割安  **唯一きれいに効いた**。絶対利回りとリターンの相関 0.250、
                     #             5分位で +15% → +65% と単調。4コホートすべてで正
  trap_penalty: 1.0  # F 減点の効き具合

scoring:
  payout_ideal_low: 0.30      # 配当性向のスイートスポット
  payout_ideal_high: 0.50
  # 「15%未満は還元意思なし」という前提は、2026-09-15 の検証で**支持されなかった**。
  # 配当性向15%未満の帯は、減配率 7.4%（全帯でいちばん低い）・DPS成長 +80.0%
  # （いちばん高い）だった。しかもその帯は利回り 1.7% で、利回りの条件で
  # すでに落ちる。減点すると二重に罰することになる。
  # 本当に還元する気が無いと言えるのは、ほぼ無配に近い水準だけなので 5% に下げた。
  payout_too_low: 0.05        # これ未満は還元意思なしとして減点
  # ヘムの中核ルール「配当性向 < 配当利回り × 10」を連続値にしたもの。
  # 配当利回り×10 ÷ 配当性向 が 1.0 を超えるとヘム基準を満たす（PER<10 と同値）。
  # ゲートにすると 402 → 53 銘柄まで落ちて情報を捨てるので、加点指標として使う。
  hem_ratio_threshold: 1.0
  # 2026-09-16 の検証: 窓を振って、自己利回りパーセンタイル上位30銘柄の5年リターンを比較。
  #     3年 43.4%  5年 40.9%  7年 45.8%  10年 57.4%  15年 58.0%
  # 測れる銘柄数は 9,016〜9,056 とほぼ変わらない（長くしても取りこぼさない）。
  # 15年との差はわずかで、株価データが1999年からなので15年だと古い相場に寄る。10年にする。
  # ただしこの指標は**時期によって効いたり効かなかったりする**。
  # リターンとの相関は 2014・2016 コホートでは −0.005、2018・2020 では +0.227。
  yield_percentile_window_years: 10

traps:
  # 2026-09-16 の検証（延べ15,894 銘柄・年、2年以内の減配を的中させられるか）で、
  # **利回りは絶対値ではなく市場の中の順位で見るべき**と分かった。
  # 絶対6.5%は延べ15,884件のうち18件しか切らず、事実上働いていなかった。
  extreme_yield_percentile: 0.90  # 配当を出している銘柄の中での利回り順位（上位10%）
  extreme_yield: 0.065        # 相対順位が取れないときの保険（候補が50銘柄未満のとき）
  near_low_threshold: 0.15    # 52週レンジ下位15%を「安値圏」とする
  accrual_gap_threshold: 0.30 # 純利益と営業CFの乖離率（検証ではリフト1.15。ほぼ効かない）
  payout_creep_delta: 0.20    # 配当性向が前期比でこれだけ跳ねたら警告（リフト1.47）
  payout_creep_floor: 0.50    # 水準がこれ未満なら余力ありとみなす（検証で妥当と確認）
  earnings_slide_years: 2     # 純利益が連続で減った期数
  # dilution_threshold は廃止。発行済株数の増加は減配のリフト0.94で、
  # むしろ減配しにくい側だった（希薄化＝増配の妨げ、という理屈は日本株では成り立たない）

# ---- 買い付け優先度 ----
# 発掘スコア（total）は「市場にまだ気づかれていないか」を含むので、
# 見つけるための順位であって、いま買う順位ではない。
# 限られた資金を配るときは別の式で優劣をつける。
# 優先度 = √(割安度 × 配当継続) × 補完度係数 − トラップ減点
# 加重和にすると「安いが配当が危ない」が上位に来る（実測: 割安95・継続34 の銘柄が
# 加重和69点で上位に入っていた）。両方そろって初めて買う、という性質を式にする。
buy_priority:
  # 2026-09-15 の検証で、**絶対利回りのほうが自己利回り順位より強い**と出た。
  # トータルリターンとの相関（自己:絶対 の比率を振って測定）
  #     学習 2014・2016    0:100 → 0.099   60:40 → 0.029   100:0 → -0.022
  #     検証 2018・2020    0:100 → 0.330   60:40 → 0.282   100:0 →  0.206
  # 学習で選んだ答え（絶対利回り寄り）が検証でも確認できた。
  # 0:100 が最良だが、自己利回り順位を完全に捨てると「いつも高利回りの銘柄を
  # いくらでも買う」形になるので、20% だけ残す。ここは数字ではなく判断。
  self_yield_weight: 0.2   # 割安度のうち「自己利回り順位」の比率
  abs_yield_weight: 0.8    # 割安度のうち「候補内での絶対利回り順位」の比率
  fit_swing: 0.2           # 補完度による上下の幅（±10%）
  # 足切り（順位を付ける前に外す）
  min_health: 40           # 配当継続スコアがこれ未満なら、安くても買わない
  max_trap_penalty: 10     # 高配当トラップの減点がこれ以上なら買わない
  # 増配余力の条件（画面で入り切りできる。既定は切）。
  # 2026-09-15 の検証で、高利回りにこれを重ねると
  #     高利回り上位30%              減配率 8.8%  リターン +80.4%
  #     ＋ 配当性向 50%以下           減配率 7.0%  リターン +83.2%
  #     ＋ 営業CFが配当の3倍以上       減配率 5.4%  リターン +90.6%
  # と減配率が 44% 下がった。ただしコホートが1つ・3年しかなく、
  # かけると候補の利回り中央値が 4.17% → 3.82%（FCF3倍なら 3.28%）に落ちる。
  # 強制はせず、ケンが選べるようにする。
  capacity_max_payout: 0.50   # 配当性向の上限
  capacity_min_fcf_cover: 2.0 # FCFが配当の何倍あれば良しとするか
  # 日本株は100株単位。1単元は10万〜70万円が普通なので、「1銘柄あたり入金の15%まで」
  # といった上限をそのまま当てると単元が上限を超える銘柄が全部落ちる（実測: 投入枠
  # 30万円に対して上位25銘柄のうち買えたのは3銘柄、9.9万円しか配れなかった）。
  # 余った資金は、上限を超えても1単元だけ買う2周目で配る。
  single_lot_max: 0.50     # ただし1銘柄が入金のこの割合を超えることはしない
  # 単元未満株（S株・かぶミニ・ワン株）で買うと1株から配れるが、そのままだと
  # 端数で ¥297 のような細切れが1行できる。管理の手間が増えるだけで配当は増えない。
  min_ticket_yen: 3000     # 1銘柄あたりの最低金額
  min_ticket_pct: 0.02     # または入金額のこの割合（大きいほうを採用）
  topup_cap_multiple: 1.5  # 端数を積み増すときに、1銘柄あたりの上限を何倍まで許すか

# ---- 不況に弱い業種 ----
# 2026-09-16 の検証（scripts/validate_sector_shock.py）で分かったこと。
#
#   業種は **平時の減配** を予測しない（業種ごとの減配率の順位は、2014年と2020年で
#   相関 0.08 しかない）。この点は 2026-09-15 の検証どおり。
#   しかし **不況のときの配当の落ち込み** は、業種で強く決まっていた。
#       リーマン ↔ コロナ  の順位相関 +0.622
#       リーマン ↔ 東日本大震災          +0.455
#   毎回、同じ顔ぶれがやられる。
#
# 下の9業種は、**リーマンの実績だけを見て**選んだもの（コロナの結果は一切見ていない）。
# それをコロナに当てはめた答え合わせ（40銘柄・等金額）:
#       上限なし      配当の減り 12.1%
#       25%まで                11.6%
#       15%まで                11.0%
#       ゼロ                    9.5%
# しかも避けてもリターンは落ちない。高利回り上位30%の中で比べると
#       全部        5年リターン +52.1%  減配率 58.9%
#       これらを除く            +54.3%        54.8%
#       これらだけ              +47.5%        68.6%
#
# 注意: **1業種あたりの上限は効かない。** ランダムに20銘柄選べば既に平均12.7業種に
# またがっているので、上限をかけても落ち込みは 23.0% → 23.7% と変わらなかった。
# 効くのは「この9業種の**合計**が配当の何割を占めるか」のほう。
cyclical:
  sectors:
    - "証券、商品先物取引業"
    - "鉄鋼"
    - "非鉄金属"
    - "ゴム製品"
    - "電気機器"
    - "機械"
    - "精密機器"
    - "不動産業"
    - "輸送用機器"
  max_income_share: 0.25    # 年間配当のうち、この9業種が占めてよい上限

# ---- 相場の水準と現金の使い方 ----
# ヘムの3本目の柱「暴落時の買い向かい」。現金を残しておき、
# 日経平均PBRが下がるほど多く投入する。
market:
  # 2026-09-16 の検証7・17 で測り直して 0.30 → 0.20 に下げた。
  #
  # 【何を測ったか】総資金1,260万円＋毎月10万円を、実際の株価・配当で回した。
  # 現金を持つぶん株に入れる額は減らして、同じ総資金で比べている。
  #
  # 【分かったこと】コストの9割は「現金の比率」ではなく **いつ出すか** で決まる。
  #     現金30%・最高値から10%下落で出す   平均コスト −1.5%
  #     現金30%・20%下落で出す                     −7.8%
  #     現金30%・30%下落で出す                    −14.2%
  # 同じ30%でも、寝かせる期間の長さでコストが10倍違う。
  #
  # 【守りはタダでは買えない】落ち込みを5.3ポイント浅くするのに平均8.1%払っていた。
  # 交換レートは「落ち込み1ポイントあたり1〜1.5%」で、どこを選んでも大きくは変わらない。
  # ケンは売らずに持ち続ける前提なので途中の落ち込みは実現しない。値打ちがあるのは
  # **暴落のときに動かせる弾があること**のほうで、それは20%で足りる。
  cash_reserve: 0.20          # 平常時に残しておく現金の割合（総資産に対して）

  # 【regimes は据え置き】2026-09-16 に一度「相場の高さで絞っても一律に絞るのと
  # 区別がつかない」と書いたが、**あれは間違いだった**。日経PBRの過去が取れないので
  # 株価の分布で代用したせい。株価が上がり続ける市場では常に「高い」を指してしまう
  # （76%の期間が「高い」判定）。純資産も一緒に増えるPBRとは別物だった。
  # 有報の純資産から市場PBRを組んで測り直すと、こうなる（2014-07〜2026-09）。
  #     全額投入                    100.0
  #     regimes で絞る（いまの形）    99.1   ← ほぼコストなし
  #     一律8割に絞る                 90.2   ← こちらが悪い
  # PBRで絞るのには意味があった。
  regimes:
    - {pbr_below: 0.95, name: "総力戦", deploy: 1.00,
       note: "リーマン級。取ってある現金を全部使う局面"}
    - {pbr_below: 1.10, name: "大人買い", deploy: 1.00,
       note: "歴史的な安値圏。入金額を全額入れたうえで、現金も取り崩す"}
    - {pbr_below: 1.35, name: "買い増し", deploy: 1.00,
       note: "安い。入金額は全額入れてよい"}
    - {pbr_below: 1.60, name: "平常", deploy: 0.80,
       note: "ふつうの水準。入金額の8割を入れ、残りは現金に積む"}
    - {pbr_below: 1.90, name: "やや高い", deploy: 0.60,
       note: "やや高い。入金額の6割にとどめ、現金を厚くする"}
    - {pbr_below: 99.0, name: "高い", deploy: 0.40,
       note: "高い。入金額の4割にとどめ、暴落に備えて現金を貯める"}

  # 大人買いライン（日経平均PBRが下がったら、取ってある現金のうち何割を入れるか）
  #
  # 【2026-09-16 に段を手前へ寄せた】
  # 日経平均PBRの過去は取れないので、有報の純資産と株価から市場PBRを組んだ
  # （2014-07〜2026-09、平均3,091銘柄）。範囲 1.03〜1.92、中央値 1.33。
  # **コロナの底でも1.05で、この12年で1.00を割ったことは一度も無い。**
  # 日経平均PBRに直すと、12年の底はおよそ 1.07（2016年）・1.09（2020年）。
  #
  # ところが前の段は 1.40/1.30/1.20/1.10/1.00/0.90/0.80 で、
  # **下3段（1.00/0.90/0.80）に取ってある現金の40%を置いていた**。
  # その4割は12年間ずっと寝ていたことになる。
  #
  # 段を振り直して測った結果（総資金1,260万＋毎月10万、全額投入を基準）
  #     前の段（現金30%）                        −8.4%  寝たまま40%  4/7段が発火
  #     1.55/1.45/1.35/1.20/1.05/0.85（20%）   −5.6%  寝たまま25%  4/6
  #     1.55/1.45/1.35/1.20/1.10/0.90（20%）   −4.9%  寝たまま10%  5/6  ★採用
  #     1.60/1.45/1.30/1.15/1.00/0.85（20%）   −5.3%  寝たまま20%  4/6
  #
  # **PBR 0.80 は実在する水準**（2009年3月、日経平均7,054円のとき）なので消さない。
  # ただし17年来ていない水準に40%は置きすぎ。0.90 に10%だけ残す。
  #
  # 【2026-09-29 最後の段を 0.90 → 0.95 に少しゆるめた】ケンの判断。0.95 もこの12年で
  # 一度も来ていない（12年の底は日経平均PBR およそ1.07）ので、過去検証の成績は変わらない。
  # 次の暴落で、残りの10%を少し早めに使うための変更。相場の区分「総力戦」も同じ値にそろえた。
  ladder:
    - {pbr: 1.55, deploy: 0.15}   # ここから−17%。よくある押し目
    - {pbr: 1.45, deploy: 0.20}   # −22%
    - {pbr: 1.35, deploy: 0.20}   # −27%。12年の中央値あたり
    - {pbr: 1.20, deploy: 0.20}   # −35%
    - {pbr: 1.10, deploy: 0.15}   # −41%。2016年と2020年に実際に到達した水準
    - {pbr: 0.95, deploy: 0.10}   # −49%。リーマン級。来なければ寝たままでいい

portfolio:
  tax_rate_specific: 0.20315  # 特定口座
  tax_rate_nisa: 0.0
  max_sector_weight: 0.20     # 33業種ベースの上限（評価額。目安表示用）
  # 2026-09-16 の検証14: 1銘柄あたりの上限をかけると、**リターンをまったく
  # 犠牲にせず**実質の分散が 16.5 → 25.0 銘柄ぶんに改善した（20年の積み立て、
  # 5つの開始時期すべてでリターンは同じかわずかに上）。ほぼ無料の改善。
  #
  # 上限は **評価額ではなく配当** にかける。守りたいのはインカムで、
  # 高利回りの銘柄は評価額より配当のほうが偏るため（実測: ケンの景気敏感業種は
  # 評価額22.2% に対して配当29.5%）。
  max_income_weight: 0.05     # 1銘柄が年間配当に占めてよい上限

paths:
  db: "data/scout.db"
  # 引き継ぎ元（参照専用で凍結済み）。手で動かす取り込みスクリプトからしか読まない。
  # 自動更新からは触らないこと。デスクトップ配下は macOS がバックグラウンドの
  # プログラムから隔離するので、定期実行から読ませると黙って失敗する。
  legacy_dir: "~/Desktop/クロード/portfolio-manager/data"
